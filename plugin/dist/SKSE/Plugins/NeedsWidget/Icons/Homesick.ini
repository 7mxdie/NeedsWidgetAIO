; Homesick, from Simple Needs Expanded - Eat Sleep Drink Go Home (Nexus 180298), whose plugin
; is Super Simple Needs.esp too (ESL-flagged or not). Hours since you were last in a player
; home, on a scale where its warning (aaaSSN_HoursToGetHomesickWarning, 72 h) is 60 and
; homesick (aaaSSN_HoursToGetHomesick, 120 h) is 100, so moving those in the console moves
; the stages too. Hidden until the mod has seen you in a player home once, and while
; aaaSSN_ShouldTrackHomesick is 0. Stages follow the mod's hunger and sleep icons.
[Icon]
sName = Homesick
sArt = homesick
fMax = 100
bHigherIsWorse = 1
fStage1 = 30
fStage2 = 60
fStage3 = 100
fStage4 = 100
fStage5 = 1000
sStage0 = Recently Home
sStage1 = Away
sStage2 = Getting Homesick
sStage3 = Homesick
sStage4 = Homesick
sStage5 = Homesick
iFineUpTo = 1

[Source1]
sMod = Simple Needs Expanded
sType = SimpleNeedsHome
sPlugin = Super Simple Needs.esp
