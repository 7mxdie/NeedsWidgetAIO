; Temperature: how cold the air is where you stand (Nostrvm: Survival Mode's compass temperature;
; IBAGadget: a Frostfall thermometer). Cold shows how cold you are; this is the weather.
; Off until the player turns it on, so it doesn't turn up in layouts already set up.
; Read from each mod's own files (2026-11-08):
;  Survival Mode Improved: SMI_CurrentAmbientTemp (0xD1D), 0-900, higher is colder, set by its dll
;    each time cold updates; bands are its Survival_ColdStage1-5Value defaults 25/150/250/450/700.
;  Survival Mode without SMI: Survival_NeedCold's currentColdLevel on Survival_NeedColdQuest
;    (0x896), 0-20 (30 in freezing water); its stages start at 1/4/7/10/13.
;  Frostfall: FrostfallCurrentTemperatureReadOnly, a whole number about like degrees C (-20 to 20,
;    10 indoors), every 5 s while Frostfall runs. Higher is warmer; the number is the temperature.
;    Bands from Frostfall's own Weathersense meter.
[Icon]
sName = Temperature
sArt = temperature
fMax = 900
bHigherIsWorse = 1
fStage1 = 25
fStage2 = 150
fStage3 = 250
fStage4 = 450
fStage5 = 700
sStage0 = Warm
sStage1 = Mild
sStage2 = Cool
sStage3 = Cold
sStage4 = Freezing
sStage5 = Bitter Cold
iFineUpTo = 1
bEnabled = 0
bShowNumber = 1

[Source1]
sMod = Survival Mode Improved
sType = Global
sPlugin = SurvivalModeImproved.esp
sEditorID = SMI_CurrentAmbientTemp
iFormID = 000D1D
sSwitchPlugin = ccqdrsse001-survivalmode.esl
sSwitchEditorID = Survival_ModeEnabled
iSwitchFormID = 000826
fSwitchOn = 1

[Source2]
