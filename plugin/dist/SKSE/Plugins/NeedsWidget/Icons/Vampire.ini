; Vampire stage, 1 to 4, for the player (Raynor1511, 2026-10-27). Skyrim.esm's
; PlayerVampireQuest (0EAFD5) keeps it in PlayerVampireQuestScript's own variable
; VampireStatus. Only counts while the global PlayerIsVampire (0ED06D) is 1, so it hides
; after a cure. Overhauls that keep the vanilla quest and script work the same way;
; one that replaces them isn't read.
; Stage 1 is fed (stage 0 colour), 2 and 3 the middle, 4 the worst.
[Icon]
sName = Vampire
sArt = vampire
fMax = 4
bHigherIsWorse = 1
fStage1 = 2
fStage2 = 2
fStage3 = 3
fStage4 = 4
fStage5 = 4
sStage0 = Stage 1
sStage1 = Stage 2
sStage2 = Stage 2
sStage3 = Stage 3
sStage4 = Stage 4
sStage5 = Stage 4
iFineUpTo = 0

[Source1]
sMod = Vampirism
sType = ScriptVariable
sPlugin = Skyrim.esm
iFormID = 0EAFD5
sScript = PlayerVampireQuestScript
sVariable = VampireStatus
sSwitchEditorID = PlayerIsVampire
iSwitchFormID = 0ED06D
fSwitchOn = 1
fNoValueBelow = 1
