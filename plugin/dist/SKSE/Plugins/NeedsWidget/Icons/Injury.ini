; Injury from Blade & Blunt (BladeAndBlunt.esp), which Starfrost turns into a survival need.
; Its three injury abilities on the player: Minor 84A, Major 84B, Critical 84D. Works with
; Blade & Blunt alone too. Off while MAG_InjuriesAndRest (83F) isn't 1, which Blade & Blunt
; sets from bEnableInjuries in its ini. Its infections are diseases: the Disease icon has those.
; Rogues 'n Raiders (Nexus 47504, 4.2.3.2), CenteredSword 2026-10-27: its Penalty System puts
; timed injury effects on the player, each tagged with its tier, zzRnR_Level01-05InjuryKW
; (E02646-E0264A in Rogues 'n Raiders.esp). The worst tier on you is the stage. Blade & Blunt
; wins if you have both.
