; Werewolf (ladyshaiana): seconds left in beast form. The game's own records, no mod needed:
; PlayerWerewolfChangeScript sets PlayerWerewolfShiftBackTime (Skyrim.esm 02BA19) to when you
; change back, in game days, and feeding pushes it on. Time left = that minus GameDaysPassed,
; turned into real seconds with TimeScale. Beast form lasts 150 seconds before feeding.
; Hidden unless you're transformed. The number is the seconds left.
