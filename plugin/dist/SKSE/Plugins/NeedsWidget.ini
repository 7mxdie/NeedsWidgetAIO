; How things look. No sliders for these: they are for reskins.
; Sizes are in icon units: an icon is 64 across, centred on 0,0.
[Style]
; Ring look: icons/<sRingFrame>.swf sits behind the icon picture.
sRingFrame = frame_ring
fRingArtSize = 42
fRingArtY = 0
fRingRadius = 27.5
fRingWidth = 1.8
fRingLabelY = 31

; Bar look: icons/<sBarFrame>.swf sits behind, the fill is drawn inside the bar.
sBarFrame = frame_bar
fBarArtSize = 44
fBarArtY = -4
fBarLeft = -16.2
fBarTop = 21.8
fBarLength = 32.4
fBarHeight = 0.8
fBarLabelY = 25

; Icon only look: no frame.
fIconArtSize = 46
fIconArtY = 0
fIconLabelY = 22
