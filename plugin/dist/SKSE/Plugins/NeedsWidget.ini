; Needs Widget AIO - default layout and look.
; Don't edit this to move things: use the sliders in the F1 menu (SKSE Menu
; Framework). Save there writes your layout to NeedsWidget_Custom.ini, which wins
; over this file. A reskin replaces this file and the pictures in
; Interface/NeedsWidget/icons/.

[General]
; 0 = Ring: a ring round each icon fills up as the need gets worse
; 1 = Bar: a small bar under each icon
; 2 = Icon only: just the icon, coloured as the need gets worse
iLook = 0
; 1 = colour the icons as needs get worse, 0 = only the ring or bar changes colour
bTintIcons = 1
; 1 = the ring or bar starts full and drains as the need gets worse (the percent too),
; 0 = it fills up as the need gets worse
bMeterDrains = 0
; Colours for the stages, best to worst:
; 0 = Bone to red: bone white when fine, then pale gold, gold, orange, red, bright red
; 1 = Green to red: green when fine through to bright red
; 2 = Custom: the six sStageColor values just below
iColorScheme = 0
; The Custom colours, best (0) to worst (5), as RRGGBB. Pick them on the General
; page in the menu; a reskin with its own colours sets these and iColorScheme = 2.
sStage0Color = ECE9E2
sStage1Color = E8DDB0
sStage2Color = E8C870
sStage3Color = E8A060
sStage4Color = D9503F
sStage5Color = FF2E1F
; 1 = an icon fades in and out while that need is at its worst stage
bPulseWorst = 1
; 1 = numbers above the icons, 0 = below (each icon's bShowNumber turns its number on)
bNumbersAbove = 0
; Number size in percent (they also scale with the icons), distance from the icon
; and sideways nudge in icon units (an icon is 64 across), 1 = colour like the icon
fNumberSize = 100.0
fNumberGap = 0.0
fNumberX = 0.0
bNumberTint = 0
; 1 = a dark edge round the numbers, so they read over snow and sky
bNumberEdge = 1
; 0 = numbers show the percent, 1 = the stage's name
iNumberShows = 0
; The numbers' font: 0 = Medium, 1 = Bold, 2 = Light, 3 = Plain (the console's),
; 4 = Book, 5 = Handwritten. The game's own fonts, so a font mod changes them too.
iNumberFont = 0
; Letters: 0 = as written, 1 = lower case, 2 = upper case
iNumberCase = 0

; 1 = fade out once nothing has changed for fFadeAfter seconds; bKeepBadShown = 1
; keeps it up while a need is at its worst two stages
bFadeWhenStill = 0
fFadeAfter = 8.0
bKeepBadShown = 1
; 1 = an icon flashes when its need gets worse
bFlashWorse = 1
; The widget's key, a keyboard scan code (0 = none; set it in the menu).
; iHotkeyMode 0 = it hides and shows the widget, 1 = it brings a faded widget back
iHotkey = 0
iHotkeyMode = 0
; Size of all icons, in percent. Scales the icons and the gaps between them.
fGroupSize = 100.0

; Layout: 0 = Row, 1 = Column, 2 = Free (each icon at its own fPosX/fPosY below)
iArrangement = 0
; Row and Column: 1 = start from the right end of a row / bottom of a column,
; 0 = from the left / top. fLinePosX/Y is where that end icon's centre sits, in
; percent of the screen; the line grows away from it.
bFromFarEnd = 1
fLinePosX = 96.0
fLinePosY = 87.0
; Gap between icons, in percent of an icon's size.
fSpacing = 7.0
; 1 = a hidden icon leaves no hole: the others close up towards the start end.
bCloseGaps = 1
; Icons per row (or column) before a new one starts, from the same end. 0 = no limit.
iPerLine = 0
; 1 = new rows go above (new columns to the left), 0 = below (to the right).
bWrapBefore = 1
; Gap between rows or columns, in percent of the biggest icon's size.
fLineGap = 15.0
; Order along the line, left to right or top to bottom:
; 0 Hunger, 1 Cold, 2 Fatigue, 3 Stress, 4 Dirt and Blood, 5 Encumbrance,
; 6 Thirst, 7 Wetness, 8 Vitality, 9 Disease. Needs left out go on the end;
; needs whose mod isn't in the game take no place.
sOrder = 9,0,6,1,7,2,8,3,4,5

; Free layout only: move the whole group, in percent of the screen. Each icon's
; own section below places it within the group.
fGroupMoveX = 0.0
fGroupMoveY = 0.0

